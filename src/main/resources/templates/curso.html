<!DOCTYPE html>
<html lang="es">
<html xmlns:th="http://www.thymeleaf.org">


<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inicio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">
				<img src="../../img/logo.svg" alt="Logo" width="150">
			</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item">
						<a class="nav-link active text-light" href="/">Inicio</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-light" href="/crearCurso">Crear curso</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-light" href="/categorias">Gestionar categorias</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>


	<div class="container mt-5">
		<div class="row">
			<div class="col-8">
				<h1 th:text="${curso.titulo}" class="display-1"></h1>
				<hr>
				<h4>Descripción del curso:</h4>
				<p th:text="${curso.descripcion}" class="text-muted m-2"></p>
			</div>
			<div class="col-4">
				<img th:src="${curso.urlImagen}" class="img-fluid">
			</div>
		</div>
		<hr>

		<div th:if="${curso.id != 0}" class="d-flex gap-2 mb-3">
			<a class="btn btn-warning" th:href="@{/actualizarCurso/{id}(id=${curso.id})}">Actualizar.</a>
			<a class="btn btn-danger" th:href="@{/eliminarCurso/{id}(id=${curso.id})}">Eliminar.</a>
		</div>

		<div th:if="${curso.id == 0}" class="d-flex gap-2 mb-3">
			<a class="btn btn-dark" th:href="@{/actualizarCurso/{id}(id=${curso.id})}">Actualizar.</a>
			<a class="btn btn-secondary" th:href="@{/eliminarCurso/{id}(id=${curso.id})}">Eliminar.</a>
		</div>


	</div>


	<footer class="bg-dark text-white py-3 mt-5">
		<div class="container text-center">
			<p>© 2024 Ficticion Studio.</p>
			<p>
				<a href="#" class="text-white text-decoration-none mx-2">Términos de uso</a> |
				<a href="#" class="text-white text-decoration-none mx-2">Política de privacidad</a>
			</p>
		</div>
	</footer>


	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>

</html>
