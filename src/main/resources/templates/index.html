<!DOCTYPE html>
<html lang="es">
<html xmlns:th="http://www.thymeleaf.org">


<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inicio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">
				<img src="img/logo.svg" alt="Logo" width="150">
			</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item">
						<a class="nav-link active text-light" href="/">Inicio</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-light" href="/crearCurso">Crear curso</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-light" href="/categorias">Gestionar categorias</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>


	<div class="container mt-5">
		<div class="row">
			<div class="col-8">
				<h1 class="display-1">Fiction Studio</h1>
				<h3 class="display-6">El mejor sitio web sobre cursos de programación</h3>
				<p class="text-muted mt-3">Aprende, enseña y comparte conocimientos sobre los lenguajes más usados del
					mercado.</p>
			</div>
			<div class="col-4">
				<img class="img-fluid" src="img/logo.svg" style="width: 200px; height: auto;">
			</div>
		</div>


		<div class="mt-5" th:each="categoria : ${categorias}">

			<h2 class="display-5 mb-1" th:text="${categoria.nombre}"></h2>

			<hr>

			<div class="row">
				<div class="col-6 col-md-3 mt-1" th:each="curso : ${categoria.cursos}">
					<img class="img-fluid border" th:src="${curso.urlImagen}">
					<div class="card">
						<div class="card-body bg-light">

							<a class="card-title text-primary" th:text="${curso.titulo}"
								th:href="@{/curso/{id}(id=${curso.id})}"></a>
							<p class="card-text" th:text="${curso.descripcion}"></p>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<footer class="bg-dark text-white py-3 mt-5">
		<div class="container text-center">
			<p>© 2024 Fiction Studio.</p>
			<p>
				<a href="/generarDatos" class="text-white text-decoration-none mx-2">Generar Datos</a> |
				<a href="/eliminarTodo" class="text-white text-decoration-none mx-2">Eliminar todo</a>
			</p>
		</div>
	</footer>





	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>

</html>
